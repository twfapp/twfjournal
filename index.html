<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TWF Journal">
<meta name="theme-color" content="#06080c">
<script>try{if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("pwa")}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234c74ff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="">
<title>TWF Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080c; --bg2:#0b0e14; --panel:#0f131b; --panel2:#141a24; --line:#1d2431; --line2:#283143;
  --ink:#eef1f6; --ink2:#b6bfcc; --ink3:#8691a3; --accent:#4c74ff; --accent2:#2f57e6; --accentSoft:rgba(76,116,255,.14);
  --pos:#2fbf71; --neg:#e5534b; --amber:#e0a33a; --glow:rgba(47,87,230,.28);
  --shadow:0 10px 40px rgba(0,0,0,.45); --r:14px; --side:250px;
}
body.theme-light{
  --bg:#f3f5f9; --bg2:#ffffff; --panel:#ffffff; --panel2:#f5f7fb; --line:#e3e7ef; --line2:#d3d9e4;
  --ink:#121826; --ink2:#3d4757; --ink3:#5f6b7d; --accent:#2f57e6; --accent2:#1d3557; --accentSoft:rgba(47,87,230,.10);
  --pos:#1f9d55; --neg:#d64545; --amber:#b8760a; --glow:rgba(47,87,230,.12); --shadow:0 10px 30px rgba(20,30,60,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--accent)}
.hide{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Logo ---------- */
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em}
.logo .mark{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.logo .mark b{font-size:20px;letter-spacing:.08em}
.logo .mark i{display:block;height:3px;width:100%;background:var(--accent);border-radius:2px;margin-top:3px}
.lgtile{display:inline-grid;place-items:center;flex:none;border-radius:28%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 2px 8px rgba(0,0,0,.25)}.lgtile svg{width:76%;height:76%}
.lgtile.lgcur{width:30px;height:30px;color:var(--lgfg);background:linear-gradient(145deg,var(--lg1),var(--lg2))}
body.theme-light .lgtile{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(20,30,60,.12)}
.lgpick{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.lgpick button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:12px;border:2px solid transparent;font-size:11.5px;font-weight:600;color:var(--ink2)}
.lgpick button.on{border-color:var(--accent);color:var(--ink)}.lgpick button:hover{background:var(--panel2)}
.lgprev{display:flex;align-items:center;gap:16px;padding:14px;border-radius:14px;background:var(--panel2);margin-top:10px}.lgprev small{color:var(--ink3);font-size:12.5px;line-height:1.5}
.logo .sub{font-weight:600;font-size:13px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
#login .art{position:relative;overflow:hidden;background:radial-gradient(1200px 600px at 30% 30%,rgba(47,87,230,.35),transparent 60%),radial-gradient(800px 500px at 80% 90%,rgba(76,116,255,.18),transparent 60%),#05070b;display:flex;flex-direction:column;justify-content:space-between;padding:48px}
body.theme-light #login .art{background:radial-gradient(1200px 600px at 30% 30%,rgba(47,87,230,.30),transparent 60%),#0b1424;color:#eef1f6}
#login .art .logo .sub{color:#9aa6b8}
#login .art h1{font-size:46px;line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;color:#fff}
#login .art p{color:#b8c2d3;font-size:16px;max-width:440px;margin:0}
#login .art .candles{position:absolute;right:-40px;bottom:120px;opacity:.55}
#login .form{display:flex;align-items:center;justify-content:center;padding:40px}
.card-login{width:100%;max-width:400px}
.card-login h2{font-size:26px;margin:0 0 6px}
.card-login .muted{color:var(--ink3);margin:0 0 26px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field label .req{color:var(--neg)}
.inp{width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);outline:none;transition:.15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.btn{height:42px;padding:0 18px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent2)}
.btn-g{background:var(--panel2);border:1px solid var(--line2);color:var(--ink)}
.btn-g:hover{border-color:var(--ink3)}
.btn-ghost{color:var(--ink2)}
.btn-ghost:hover{color:var(--ink)}
.btn-danger{background:rgba(229,83,75,.12);color:var(--neg);border:1px solid rgba(229,83,75,.35)}
.btn-block{width:100%}
.m-logo{display:none!important}
.nav .lbl{white-space:nowrap}
.err{color:var(--neg);font-size:13px;min-height:18px;margin:-4px 0 10px}
.switch-line{margin-top:18px;color:var(--ink3);text-align:center}
.switch-line button{color:var(--accent);font-weight:700}

/* ---------- Shell ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:64px 1fr;grid-template-columns:var(--side) 1fr;transition:grid-template-columns .2s}
body.side-collapsed #app{grid-template-columns:76px 1fr}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.topbar .spacer{flex:1}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);position:relative}
.ib:hover{background:var(--panel2);color:var(--ink)}
.ib .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.lang{height:36px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);padding:0 30px 0 12px;font-weight:700;font-size:13px}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden auto;background:var(--bg)}
.prof{display:flex;flex-direction:column;align-items:center;padding:22px 16px 18px;border-bottom:1px solid var(--line);margin:0 14px}
.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,var(--accent),#1d3557);display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff;position:relative}
.badge{position:absolute;top:-6px;right:-26px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--accent);color:#fff;letter-spacing:.03em}
.badge.elite{background:linear-gradient(135deg,#e0a33a,#b8760a)}
.prof .nm{margin-top:12px;font-weight:700;font-size:15px;text-align:center}
.nav{padding:14px;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:14.5px;text-align:left}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.nav .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--ink3);border:1px solid var(--line2)}
.nav .tag.new{background:var(--accent);color:#fff;border:0}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.side .bottom{margin-top:auto;padding:14px}
.side .ver{font-size:12px;color:var(--ink3);padding:4px 12px}
body.side-collapsed .side .lbl,body.side-collapsed .side .tag,body.side-collapsed .prof .nm,body.side-collapsed .badge,body.side-collapsed .side .ver{display:none}
body.side-collapsed .prof{padding:18px 0;margin:0 10px}
body.side-collapsed .avatar{width:44px;height:44px;font-size:18px}
body.side-collapsed .nav button{justify-content:center;padding:0}
main{overflow:auto;position:relative}

/* ---------- Page header ---------- */
.phead{position:relative;padding:30px 34px 0;background:linear-gradient(180deg,rgba(47,87,230,.16),transparent 140%);border-bottom:1px solid var(--line)}
body.theme-light .phead{background:linear-gradient(180deg,rgba(47,87,230,.08),transparent 140%)}
.phead h1{margin:0 0 22px;font-size:32px;letter-spacing:-.02em}
.tabs{display:flex;gap:6px}
.tabs button{display:flex;align-items:center;gap:8px;padding:12px 16px;color:var(--ink3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.streak{position:absolute;right:34px;top:30px;display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);font-weight:700}
.streak b{font-size:22px}
.pbody{padding:28px 34px 40px}

/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.box h3{margin:0 0 4px;font-size:15px}
.box .sub{color:var(--ink3);font-size:13px}
.hero{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;align-items:stretch}
.hero .welcome{background:radial-gradient(600px 260px at 0% 0%,var(--glow),transparent 70%),var(--panel)}
.hero .welcome h2{margin:0 0 8px;font-size:24px}
.hero .welcome p{color:var(--ink2);margin:0 0 18px;line-height:1.55}
.choice{display:flex;align-items:flex-start;gap:14px;padding:22px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);text-align:left;transition:.15s}
.choice:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.choice.primary{border-color:var(--accent)}
.choice .ci{width:42px;height:42px;border-radius:12px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;flex:none}
.choice b{display:block;font-size:16px;margin-bottom:5px}
.choice span{color:var(--ink3);line-height:1.45}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13px;font-weight:600}
.kpi .val{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.kpi .val small{font-size:14px;color:var(--ink3);font-weight:600;margin:0 6px 0 2px}
.recent{grid-column:span 8}
.guide{grid-column:span 4}
.row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.pill{white-space:nowrap;font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink2)}
.pill.acc{background:var(--accentSoft);color:var(--accent);border-color:transparent}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;color:var(--ink3);gap:10px}
.empty h4{margin:6px 0 0;color:var(--ink);font-size:19px}
.empty .ei{width:56px;height:56px;border-radius:16px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2)}
.carousel{position:relative;overflow:hidden;border-radius:12px}
.slides{display:flex;transition:transform .35s ease}
.slide{min-width:100%;padding:4px}
.slide .ill{height:150px;border-radius:12px;background:radial-gradient(300px 140px at 50% 120%,var(--glow),transparent 70%),var(--panel2);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:14px;color:var(--accent)}
.slide b{display:block;font-size:15px;margin-bottom:5px}
.slide span{color:var(--ink3);line-height:1.45}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.cnav{display:flex;justify-content:space-between;margin-top:10px}

/* ---------- Lists / tables ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .search{flex:1;min-width:220px;position:relative}
.toolbar .search svg{position:absolute;left:12px;top:12px;color:var(--ink3)}
.toolbar .search input{padding-left:38px}
.chip{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink2)}
.chip:hover{color:var(--ink);border-color:var(--ink3)}
.chip.on{border-color:var(--accent);color:var(--ink)}
.chip .n{background:var(--panel2);border-radius:6px;padding:1px 7px;font-size:12px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chips2 span{padding:6px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:600}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;transition:.15s}
.ccard:hover{border-color:var(--line2)}
.ccard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ccard .ttl{font-weight:800;font-size:16px}
.ccard .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard .meta div{background:var(--panel2);border-radius:10px;padding:10px 12px}
.ccard .meta small{display:block;color:var(--ink3);font-size:12px;margin-bottom:3px}
.ccard .meta b{font-size:14px}
.ccard .acts{display:flex;gap:8px;margin-top:auto}
.ccard .acts .btn{height:36px;font-size:13px}
.swatch{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:-1px}
table.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{text-align:left;font-size:12px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(3,5,9,.66);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .15s}
body.theme-light .ov{background:rgba(20,26,40,.35)}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:820px;max-height:calc(100vh - 40px);background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal.sm{max-width:520px}
.mh{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px}
.mh .spacer{flex:1}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:3px}
.seg button{padding:7px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink3)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mbody{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:0}
.mbody.single{grid-template-columns:1fr}
.mnav{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.mnav button{text-align:left;padding:12px;border-radius:10px}
.mnav button b{display:block;font-size:14px;margin-bottom:4px}
.mnav button span{font-size:12px;color:var(--ink3);line-height:1.4}
.mnav button.on{background:var(--panel2)}
.mcont{padding:22px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
.opts{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2)}
.opts button{height:38px;padding:0 16px;border-radius:9px;font-weight:700;background:var(--panel);border:1px solid var(--line2)}
.opts button.on{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2)}
.sw{width:40px;height:23px;border-radius:12px;background:var(--line2);position:relative;transition:.15s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:20px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:-8px;margin-bottom:14px}
.ms{position:relative}
.ms .box2{min-height:44px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 36px 6px 8px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);cursor:pointer}
.ms .box2 .ph{color:var(--ink3);padding-left:6px}
.ms .tagx{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:4px 8px;font-weight:700;font-size:13px}
.ms .tagx i{font-style:normal;color:var(--ink3);cursor:pointer}
.ms .dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);z-index:5;padding:6px;max-height:280px;overflow:auto}
.ms .dd button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:8px;text-align:left}
.ms .dd button:hover{background:var(--panel2)}
.ms .dd .chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center}
.ms .dd .chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sym{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none}
.ms .dd small{color:var(--ink3);margin-left:auto;font-size:12px}
.period{border:1px solid var(--line2);border-radius:12px;padding:16px;background:var(--panel2)}
.rules{display:flex;flex-direction:column;gap:8px}
.rules .rl{display:flex;gap:8px}
.rules .rl .inp{height:40px}

/* ---------- Toasts ---------- */
body.in-sx #toasts{bottom:112px;left:66px}
#toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:80;max-width:min(440px,calc(100vw - 40px))}
.toast{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.toast .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;position:relative;color:var(--lgfg,#fff);background:linear-gradient(145deg,var(--lg1,#6d8dff),var(--lg2,#2f57e6));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}

.pkbtn{display:flex!important;align-items:center;justify-content:center;gap:9px;margin-top:10px}

/* =========================================================
   TWF JOURNAL v16 — aanvullend op het TWF-design (gedeeld met Backtest)
   ========================================================= */
.hide{display:none!important}
.mono{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--ink3)}
.jpage{padding:26px 32px 48px;max-width:1360px;margin:0 auto}
.jhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.jhead h1{margin:0;font-size:30px;letter-spacing:-.02em}
.jhead p{margin:6px 0 0;color:var(--ink3);font-size:14px}
.jhead .acts{display:flex;gap:10px;flex-wrap:wrap}
.jgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.jgrid>*{min-width:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1180px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.c3{grid-column:span 6}}
.box h3{display:flex;align-items:center;gap:8px}
.boxh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.boxh h3{margin:0}
.link{color:var(--accent);font-weight:700;font-size:13.5px}
/* account-kiezer */
.acctbtn{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 8px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;max-width:320px;min-width:0}
.acctbtn .ad{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.acctbtn .ad.live{background:linear-gradient(145deg,#2fbf71,#138a4b)}.acctbtn .ad.bt{background:linear-gradient(145deg,#6d8dff,#2f57e6)}
.acctbtn .an{display:flex;flex-direction:column;line-height:1.1;min-width:0;text-align:left}
.acctbtn .an b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acctbtn .an small{font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acctlist{display:flex;flex-direction:column;gap:6px}
.acctlist .grp{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 4px 4px}
.acctlist button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);text-align:left;width:100%}
.acctlist button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.acctlist button .ad{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.acctlist button .ad.live{background:linear-gradient(145deg,#2fbf71,#138a4b)}.acctlist button .ad.bt{background:linear-gradient(145deg,#6d8dff,#2f57e6)}
.acctlist button b{display:block;font-size:15px}.acctlist button small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.acctlist button .ar{margin-left:auto;text-align:right;font-weight:800;font-size:14px}
.acctpop{position:fixed;z-index:70;width:360px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:12px}
/* saldo-hero */
.hero2{position:relative;overflow:hidden;padding:24px 24px 14px;background:radial-gradient(700px 300px at 0% 0%,var(--glow),transparent 70%),var(--panel)}
.hero2 .hl{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero2 .lab{color:var(--ink3);font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.hero2 .bal{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px;line-height:1.05}
.hero2 .bal.blur{filter:blur(12px);user-select:none}
.hero2 .chg{font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.chip.pos{background:rgba(47,191,113,.12);border-color:transparent;color:var(--pos)}.chip.neg{background:rgba(229,83,75,.12);border-color:transparent;color:var(--neg)}
.chip.amber{background:rgba(224,163,58,.14);border-color:transparent;color:var(--amber)}
.ranges{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:3px}
.ranges button{height:32px;padding:0 11px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--ink3)}
.ranges button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.eqwrap{position:relative;margin-top:14px;height:230px;touch-action:pan-y}
.eqwrap svg{display:block;width:100%;height:100%;overflow:visible}
.eqtip{position:absolute;top:0;pointer-events:none;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow);display:none}
.eqtip small{display:block;color:var(--ink3);font-weight:600}
.eqline{position:absolute;top:0;bottom:0;width:1px;background:var(--ink3);opacity:.5;pointer-events:none;display:none}
.eqdot{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid var(--panel);transform:translate(-50%,-50%);pointer-events:none;display:none}
/* kpi's */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1320px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:701px) and (max-width:900px){.calg{grid-auto-rows:72px}.cd{height:72px}}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kc .kl{color:var(--ink3);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.kc .kv{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .ks{color:var(--ink3);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
/* trade-lijst */
.tfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tfilters .inp{height:40px;width:auto;min-width:0}
.tfilters .search{flex:1 1 200px;max-width:320px}
.dayh{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 8px;color:var(--ink3);font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%;transition:border-color .15s,transform .1s}
.trow:hover{border-color:var(--line2)}.trow:active{transform:scale(.995)}
.trow .ti2{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;overflow:hidden;background:var(--panel2)}
.trow .ti2 img{width:100%;height:100%;object-fit:cover}
.trow .ti2.long{background:linear-gradient(145deg,#2f6bff,#1d47c9)}.trow .ti2.short{background:linear-gradient(145deg,#ef5350,#b9312e)}
.trow .tn b{display:flex;align-items:center;gap:8px;font-size:15px}.trow .tn small{display:block;color:var(--ink3);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm{color:var(--ink3);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap}
.trow .tp .rrm{display:none}.trow .tp{text-align:right;font-weight:800;font-size:16px;white-space:nowrap}.trow .tp small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.box .trow .tm{display:none}.box .trow .tp .rrm{display:block}.dpill{white-space:nowrap;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.03em}
.dpill.long{background:rgba(41,98,255,.15);color:#5b8cff}.dpill.short{background:rgba(242,54,69,.15);color:#ff6b6b}
.ico-mini{display:inline-flex;align-items:center;gap:3px;color:var(--ink3)}
/* detail */
.tdet .big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.mgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.mgrid small{display:block;color:var(--ink3);font-size:11.5px;font-weight:700}.mgrid b{display:block;margin-top:3px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;line-height:1.55;color:var(--ink2)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shots .sh{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:var(--panel2);cursor:zoom-in}
.shots .sh img{width:100%;height:100%;object-fit:cover;display:block}
.shots .sh .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.shots .add{aspect-ratio:16/10;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink3);font-weight:700;font-size:13px;background:transparent}
.shots .add:hover,.shots.drag .add{border-color:var(--accent);color:var(--accent)}
.lbox{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;touch-action:none}
.lbox .lbi{max-width:96vw;max-height:88vh;transition:transform .15s;user-select:none;-webkit-user-drag:none}
.lbox .lx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.lbox .lp,.lbox .ln{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.lbox .lp{left:14px}.lbox .ln{right:14px}
.lbox .lc{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:13px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px}
/* editor */
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.dirseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dirseg button{height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:800;color:var(--ink2)}
.dirseg button.on.long{background:rgba(41,98,255,.16);border-color:#2962FF;color:#5b8cff}.dirseg button.on.short{background:rgba(242,54,69,.16);border-color:#F23645;color:#ff6b6b}
.inp.big{height:52px;font-size:20px;font-weight:800}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;line-height:1.5;resize:vertical}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
/* kalender */
.calh2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.calh2 b{font-size:18px;text-transform:capitalize}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);grid-template-rows:auto;grid-auto-rows:86px;gap:6px}
.calg .wd{font-size:11.5px;font-weight:800;color:var(--ink3);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.cd{width:100%;height:86px;font:inherit;color:inherit;border-radius:12px;background:var(--panel2);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-width:0}
.cd .dn{font-size:12.5px;color:var(--ink3);font-weight:700}
.cd .dv{font-weight:800;font-size:13.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .dc{font-size:11px;color:var(--ink3);text-align:right}
.cd.p{background:rgba(47,191,113,.13);border-color:rgba(47,191,113,.25)}.cd.p .dv{color:var(--pos)}
.cd.n{background:rgba(229,83,75,.12);border-color:rgba(229,83,75,.22)}.cd.n .dv{color:var(--neg)}
.cd.out{opacity:.35}.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.wk{background:transparent;border-style:dashed}
.cd:not(.out):not(.wk){cursor:pointer}
/* statistieken */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbr{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.hbr .hl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .ht{height:22px;border-radius:6px;background:var(--panel2);position:relative;overflow:hidden}
.hbr .ht i{position:absolute;top:0;bottom:0;border-radius:6px}
.hbr .ht i.p{background:rgba(47,191,113,.55);left:50%}.hbr .ht i.n{background:rgba(229,83,75,.55);right:50%}
.hbr .ht::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.hbr .hv{text-align:right;font-weight:800;white-space:nowrap}
.vbars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:10px;position:relative}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;gap:6px}
.vbars .vt{width:100%;flex:1;display:flex;align-items:flex-end;position:relative}
.vbars .vt i{display:block;width:100%;border-radius:5px 5px 2px 2px;min-height:2px}
.vbars .vt i.p{background:linear-gradient(180deg,#3ddc97,#1f9d55)}.vbars .vt i.n{background:linear-gradient(180deg,#ff7a73,#c8433d)}.vbars .vt i.z{background:var(--line2)}
.vbars .vl{font-size:10.5px;color:var(--ink3);font-weight:700;white-space:nowrap}
.radar svg{width:100%;max-width:340px;display:block;margin:0 auto}
.escore{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:6px}.escore b{font-size:34px}.escore span{color:var(--ink3);font-weight:700}
.mtable{width:100%;border-collapse:collapse;font-size:13.5px}
.mtable th{text-align:left;color:var(--ink3);font-weight:700;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
.mtable td{padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtable td:last-child,.mtable th:last-child{text-align:right}
/* lijsten kapitaal */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .li{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--ink2)}
.lrow .li.dep{background:rgba(47,191,113,.13);color:var(--pos)}.lrow .li.up{background:rgba(76,116,255,.14);color:var(--accent)}.lrow .li.cr{background:rgba(224,163,58,.14);color:var(--amber)}.lrow .li.po{background:rgba(229,83,75,.12);color:var(--neg)}
.lrow .lt{flex:1;min-width:0}.lrow .lt b{display:block}.lrow .lt small{color:var(--ink3);font-size:12.5px}
.lrow .lv{font-weight:800;white-space:nowrap}
/* MT5 */
.mt5st{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mt5st .dotb{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.mt5st .dotb.live{background:rgba(47,191,113,.14);color:var(--pos)}.mt5st .dotb.stale{background:rgba(224,163,58,.14);color:var(--amber)}.mt5st .dotb.none{background:var(--panel2);color:var(--ink3)}
.mt5st h3{font-size:19px;margin:0}
.pulse{flex:none;align-self:center;width:10px;height:10px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 1.8s infinite;display:inline-block}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.keyf{display:flex;gap:8px;align-items:center}
.keyf .inp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:.02em}
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:st}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start}
.step .sn{width:40px;height:40px;border-radius:12px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:16px}
.step>div>b{display:block;font-size:15.5px;margin:8px 0 4px}.step p{margin:0;color:var(--ink2);line-height:1.55;font-size:14px}
.step code{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;font-size:12.5px;word-break:break-all}
.mock{margin-top:10px;border-radius:12px;border:1px solid var(--line2);background:#1b1f27;color:#cfd6e3;font-size:12px;overflow:hidden;max-width:460px}
.mock .mt{background:#262c38;padding:7px 10px;font-weight:700;display:flex;gap:6px;align-items:center}
.mock .mt i{width:8px;height:8px;border-radius:50%;background:#ff5f57;display:inline-block}.mock .mt i+i{background:#febc2e}.mock .mt i+i+i{background:#28c840}
.mock .mb{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mock .mrow{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;border-radius:6px;background:#232834}
.mock .mrow.hl{outline:1.5px solid #4c74ff;background:#22304f}
.mock .ck{color:#4c74ff;font-weight:800}
details.faq{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2)}
details.faq+details.faq{margin-top:8px}
details.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:'+';color:var(--ink3);font-weight:800}details.faq[open] summary::after{content:'−'}
details.faq p{margin:10px 0 0;color:var(--ink2);line-height:1.55;font-size:14px}
/* discipline */
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.ring .rv b{font-size:32px;display:block}.ring .rv small{color:var(--ink3);font-weight:700}
.quote{font-size:17px;line-height:1.5;font-weight:600;color:var(--ink);font-style:italic}
/* vergrendelscherm */
#lock{position:fixed;inset:0;z-index:200;background:radial-gradient(900px 500px at 50% -10%,rgba(76,116,255,.28),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;touch-action:manipulation}
#lock .lgtile{width:64px;height:64px}
#lock h2{margin:18px 0 4px;font-size:24px;text-align:center}
#lock .lsub{color:var(--ink3);font-size:14px;margin-bottom:26px;text-align:center}
.pdots{display:flex;gap:18px;justify-content:center;margin-bottom:12px}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink3);transition:background .08s,border-color .08s,transform .08s}
.pdots i.f{background:var(--ink);border-color:var(--ink);transform:scale(1.05)}
.pdots.err i{border-color:var(--neg)}.pdots.err i.f{background:var(--neg);border-color:var(--neg)}
.pdots.ok i{background:var(--pos);border-color:var(--pos)}
.pdots.shake{animation:shk .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.perr{height:20px;color:var(--neg);font-weight:700;font-size:14px;text-align:center;margin-bottom:18px;opacity:0;transition:opacity .12s}.perr.on{opacity:1}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center}
.pad button{width:78px;height:78px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font-size:30px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .06s,transform .06s}
.pad button small{font-size:9.5px;letter-spacing:.18em;color:var(--ink3);font-weight:700;margin-top:3px}
.pad button.pr{background:var(--line2);transform:scale(.94)}
.pad button.fn{background:transparent;border-color:transparent;font-size:15px;font-weight:700;color:var(--ink2)}
.pad button.fn svg.i{width:30px;height:30px}
.lforgot{margin-top:24px;color:var(--ink3);font-weight:700;font-size:14px}
@media (max-height:700px){.pad{grid-template-columns:repeat(3,68px);gap:12px 22px}.pad button{width:68px;height:68px;font-size:26px}#lock .lsub{margin-bottom:16px}}
/* mobiel */

function mSheet(title,html,cls=''){
  document.querySelectorAll('.tvsheet,.tvsheet-bg').forEach(x=>x.remove());
  const bg=document.createElement('div'); bg.className='tvsheet-bg'; const sh=document.createElement('div'); sh.className='tvsheet '+cls;
  sh.innerHTML=`<div class="tvs-grip"></div><div class="tvs-head"><span></span><b>${esc(title)}</b><button class="tvs-x" aria-label="Close">${ic('x',20)}</button></div><div class="tvs-body">${html}</div>`;
  document.body.append(bg,sh); requestAnimationFrame(()=>{bg.classList.add('on');sh.classList.add('on')});
  const close=()=>{ bg.classList.remove('on'); sh.classList.remove('on'); setTimeout(()=>{bg.remove();sh.remove()},220) };
  bg.onclick=close; sh.querySelector('.tvs-x').onclick=close;
  let y0=null; sh.addEventListener('touchstart',e=>{ if(sh.querySelector('.tvs-body').scrollTop<=0) y0=e.touches[0].clientY },{passive:true}); sh.addEventListener('touchend',e=>{ if(y0!=null&&e.changedTouches[0].clientY-y0>70) close(); y0=null },{passive:true});
  sh.addEventListener('pointerdown',e=>e.stopPropagation()); sh.close=close; return sh;
}

const NOTIFS=[];
function toast(title,msg,kind='info',ms=4200,action){
  const el=document.createElement('div');el.className='toast '+(kind==='ok'?'ok':kind==='bad'?'bad':'');
  el.innerHTML=`<div class="ti">${TWF_MARK}${kind==='ok'||kind==='bad'?'<i></i>':''}</div><div><b>${esc(title)}</b>${msg?`<span>${esc(msg)}</span>`:''}${action?`<button class="btn btn-g tact">${esc(action.label)}</button>`:''}</div><button class="x">${ic('x',14)}</button>`;
  el.querySelector('.x').onclick=()=>el.remove(); if(action) el.querySelector('.tact').onclick=()=>{action.fn();el.remove()};
  const tb=$('#toasts'); tb.appendChild(el); while(tb.children.length>3) tb.firstChild.remove(); setTimeout(()=>el.remove(),ms);
  NOTIFS.unshift({title,msg,at:new Date()}); NOTIFS.splice(20);
  const bb=$('#btnBell'); if(bb) bb.innerHTML=ic('bell')+'<span class="dot"></span>';
}

function relTime(date){ const m=Math.floor((Date.now()-date.getTime())/60000);
  if(m<1) return L('zojuist','just now'); if(m<60) return m+L(' min geleden',' min ago'); const h=Math.floor(m/60); if(h<24) return h+L(' uur geleden','h ago');

function loginNameToEmail(input){ const v=input.trim(); if(v.includes('@')) return v.toLowerCase(); return v.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'')+'@twfjournal.local' }

async function fetchTrades(){ const {data,error}=await sb.from('trades').select('*').eq('user_id',ME.id).order('date',{ascending:true}); if(error){ console.error(error); D.trades=[]; return }
  D.trades=(data||[]).map(r=>({ id:r.id, pair:r.pair||'', dir:/short|sell/i.test(r.dir||'')?'short':'long', pnl:Number(r.pnl)||0, rr:r.rr!=null&&r.rr!==''?Number(r.rr):null, date:r.date,
    setup:r.setup||'', note:r.note||'', hadPlan:!!r.had_plan, syncedAt:r.created_at||r.date, photos:photoList(r.photo_url), mt5:(r.setup||'')==='MT5 auto-sync', lots:r.lots!=null?Number(r.lots):null, entry:r.entry!=null?Number(r.entry):null, exitPrice:r.exit_price!=null?Number(r.exit_price):null })) }
async function fetchPayouts(){ const {data,error}=await sb.from('payouts').select('*').eq('user_id',ME.id).order('date',{ascending:false}); D.payouts=error?[]:(data||[]).map(r=>({id:r.id,amount:Number(r.amount)||0,date:r.date,note:r.note||''})) }
async function fetchAdjs(){ const {data,error}=await sb.from('adjustments').select('*').eq('user_id',ME.id).order('date',{ascending:false}); if(error){ D.adjs=[]; D.adjMissing=true; return } D.adjMissing=false; D.adjs=(data||[]).map(r=>({id:r.id,kind:r.kind,amount:Number(r.amount)||0,date:r.date,note:r.note||''})) }
/* backtest: rechtstreeks uit de Backtest-database (bt_items), anders oude bt_trades */
async function fetchBt(){ const bt={sessions:[],accounts:{},loaded:true};
  try{ const {data,error}=await sb.from('bt_items').select('kind,id,data').eq('user_id',ME.id).in('kind',['sessions','accounts']);
    if(!error&&data){ data.filter(r=>r.kind==='accounts').forEach(r=>bt.accounts[r.id]=r.data||{});
      data.filter(r=>r.kind==='sessions').forEach(r=>{ const s=r.data||{}, acc=bt.accounts[s.account]||{}, ccy=acc.currency||'USD';
        const trades=(s.trades||[]).map(x=>({ id:'bt-'+x.id, bt:true, pair:x.sym||'', dir:x.side==='sell'?'short':'long', pnl:Number(x.ccy&&x.ccy!==ccy&&x.pnlUsd!=null?x.pnlUsd:x.pnl)||0, rr:x.rr!=null?Number(x.rr):null,
          date:new Date((x.closeTime||x.openTime||0)*1000).toISOString(), openTime:x.openTime?new Date(x.openTime*1000).toISOString():null, setup:x.reason||'', note:x.notes||'', hadPlan:x.hadPlan!==false,
          lots:x.qty, entry:x.entry, exitPrice:x.exit, sl:x.sl, tp:x.tp, reason:x.reason, photos:[], sessionId:s.id }));
        bt.sessions.push({ id:s.id, name:s.name||'Sessie', type:s.type||'backtest', acctName:acc.name||'', ccy, capital:Number(s.startBalance??acc.balance)||0, balance:s.balance, start:s.start, trades:trades.sort((a,b)=>new Date(a.date)-new Date(b.date)), updated:s.updated||s.created }) }) } }catch(e){}
  if(!bt.sessions.length){ try{ const {data,error}=await sb.from('bt_trades').select('*').eq('user_id',ME.id).order('date',{ascending:true});
      if(!error&&data&&data.length){ const g={}; data.forEach(r=>{ const k=String(r.session_id||'x'); if(!g[k]) g[k]={id:k,name:r.session_name||'Sessie',type:r.session_type||'backtest',acctName:'',ccy:'USD',capital:Number(lsGet('twf_bt_capital'))||10000,trades:[]};
        g[k].trades.push({ id:'bt-'+(r.trade_id??r.id), bt:true, pair:r.pair||'', dir:/short|sell/i.test(r.dir||'')?'short':'long', pnl:Number(r.pnl)||0, rr:r.rr!=null?Number(r.rr):null, date:r.date||r.open_time, setup:r.setup||'', note:r.note||'', hadPlan:!!r.had_plan, lots:r.lots, entry:r.entry, exitPrice:r.exit_price, reason:r.reason, photos:[], sessionId:k }) });
        bt.sessions=Object.values(g) } }catch(e){} }
  bt.sessions.sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||'')));
  D.bt=bt; if(S.acct.startsWith('bt:')&&!bt.sessions.some(s=>'bt:'+s.id===S.acct)) S.acct='live' }

/* ---------------- rekening-context ---------------- */
function curCcy(){ const A=acct(); return A.ccy }
function acct(){
  if(S.acct.startsWith('bt:')){ const s=D.bt.sessions.find(x=>'bt:'+x.id===S.acct); if(s) return {kind:'bt',id:s.id,name:s.name,sub:(s.type==='propfirm'?'Prop firm':'Backtest')+(s.acctName?' · '+s.acctName:''),ccy:s.ccy,trades:s.trades,payouts:[],adjs:[],capital:s.capital,session:s} }
  return {kind:'live',id:'live',name:'Live',sub:'MT5'+(SETTINGS.login?' · '+SETTINGS.login:''),ccy:SYM2CODE[SETTINGS.currency]||'EUR',trades:D.trades,payouts:D.payouts,adjs:D.adjs,capital:SETTINGS.capital||0} }
function capSteps(A){ const st=[]; let base=A.capital; A.adjs.filter(a=>a.kind!=='credit').slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(a=>{ const delta=a.kind==='deposit'?a.amount:a.amount-base; base+=delta; st.push({t:new Date(a.date).getTime(),delta,base}) }); return st }
function capAt(A,t,steps){ steps=steps||capSteps(A); let b=A.capital; for(const s of steps){ if(s.t<=t) b=s.base; else break } return b }
function capNow(A){ return capAt(A,Infinity) }
function balanceOf(A){ return capNow(A)+A.trades.reduce((s,t)=>s+t.pnl,0)-A.payouts.reduce((s,p)=>s+p.amount,0) }
function retPct(A){ const st=capSteps(A); let r=0; A.trades.forEach(t=>{ const b=capAt(A,new Date(t.date).getTime(),st); if(b) r+=t.pnl/b*100 }); A.payouts.forEach(p=>{ const b=capAt(A,new Date(p.date).getTime(),st); if(b) r-=p.amount/b*100 }); return r }
function equitySeries(A){ const ev=[]; A.trades.forEach(t=>ev.push([new Date(t.date).getTime(),t.pnl])); A.payouts.forEach(p=>ev.push([new Date(p.date).getTime(),-p.amount])); capSteps(A).forEach(s=>ev.push([s.t,s.delta])); ev.sort((a,b)=>a[0]-b[0]);
  let run=A.capital; const pts=[]; const t0=ev.length?ev[0][0]-86400000:Date.now()-86400000*30; pts.push({t:t0,v:run}); ev.forEach(e=>{ run+=e[1]; pts.push({t:e[0],v:run}) }); if(pts[pts.length-1].t<Date.now()-60000) pts.push({t:Date.now(),v:run}); return pts }
function stats(tr,A){ const n=tr.length, wins=tr.filter(t=>t.pnl>0), losses=tr.filter(t=>t.pnl<0);
  const gp=wins.reduce((s,t)=>s+t.pnl,0), gl=-losses.reduce((s,t)=>s+t.pnl,0), net=gp-gl;
  const rs=tr.filter(t=>t.rr!=null&&!isNaN(t.rr)).map(t=>t.rr);
  const days={}; tr.forEach(t=>{ const k=dKey(t.date); days[k]=(days[k]||0)+t.pnl });
  const dv=Object.values(days); let cum=0,peak=0,mdd=0; tr.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{ cum+=t.pnl; peak=Math.max(peak,cum); mdd=Math.max(mdd,peak-cum) });
  let ws=0,ls=0,cw=0,cl=0; tr.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{ if(t.pnl>0){cw++;cl=0}else if(t.pnl<0){cl++;cw=0} ws=Math.max(ws,cw); ls=Math.max(ls,cl) });
  const cap=A?capNow(A)||1:1, plan=tr.filter(t=>t.hadPlan).length;
  return { n, wins:wins.length, losses:losses.length, wr:n?wins.length/n*100:0, gp, gl, net, pf:gl?gp/gl:(gp?99:0), aw:wins.length?gp/wins.length:0, al:losses.length?gl/losses.length:0,
    avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null, exp:n?net/n:0, days, greenDays:dv.length?dv.filter(v=>v>0).length/dv.length*100:0, mdd, ddPct:mdd/cap*100, rec:mdd?net/mdd:(net>0?10:0), ws, ls,
    best:n?Math.max(...tr.map(t=>t.pnl)):0, worst:n?Math.min(...tr.map(t=>t.pnl)):0, plan, planPct:n?plan/n*100:0 } }
function edge(m){ const c=v=>Math.max(0,Math.min(100,v));
  const ax=[['Win%',c(m.wr)],['PF',c(m.pf/3*100)],['W/L',c((m.al?m.aw/m.al:m.aw?3:0)/3*100)],[L('Consistent','Consistent'),c(m.greenDays)],[L('Max DD','Max DD'),c(100-m.ddPct*5)],[L('Herstel','Recovery'),c(m.rec/3*100)]];
  return { ax, score:Math.round(ax.reduce((s,a)=>s+a[1],0)/ax.length) } }

  const LA=(()=>{ const s=S.acct; S.acct='live'; const a=acct(); S.acct=s; return a })();

  if(D.bt.sessions.length){ h+=`<div class="grp">Backtest</div>`+D.bt.sessions.map(s=>{ const A={kind:'bt',trades:s.trades,payouts:[],adjs:[],capital:s.capital,ccy:s.ccy}; return row('bt:'+s.id,'bt',s.name,(s.type==='propfirm'?'Prop firm':'Backtest')+(s.acctName?' · '+s.acctName:'')+' · '+s.trades.length+' trades',fmtM(balanceOf(A),s.ccy,{dp:0})) }).join('') }

function openAcctPicker(anchor){
  const pick=root=>root.querySelectorAll('[data-acct]').forEach(b=>b.onclick=()=>{ S.acct=b.dataset.acct; lsSet('twfj_acct',S.acct); closeAll(); render(); toast(L('Rekening gewisseld','Account switched'),acct().name,'ok',1800) });
  let closeAll;
  if(isPhone()){ const sh=mSheet(L('Rekening','Account'),acctListHtml()); closeAll=()=>sh.close(); pick(sh); return }
  $$('.acctpop').forEach(x=>x.remove()); const p=document.createElement('div'); p.className='acctpop'; p.innerHTML=acctListHtml(); document.body.appendChild(p);
  const r=anchor.getBoundingClientRect(); p.style.left=Math.min(r.left,innerWidth-p.offsetWidth-10)+'px'; p.style.top=(r.bottom+8)+'px';
  closeAll=()=>p.remove(); pick(p);
  setTimeout(()=>{ const off=e=>{ if(!p.contains(e.target)){ p.remove(); document.removeEventListener('mousedown',off) } }; document.addEventListener('mousedown',off) },0) }

/* ---------- Overzicht ---------- */
const RANGES={'1W':7,'1M':30,'3M':91,'1Y':365,'All':0};
function pgOverview(){
  const A=acct(), tr=A.trades, m=stats(tr,A), bal=balanceOf(A), ret=retPct(A);
  const pts=equitySeries(A), days=RANGES[S.range], from=days?Date.now()-days*86400000:0, inR=pts.filter(p=>p.t>=from);
  const startV=(pts.filter(p=>p.t<from).pop()||inR[0]||{v:bal}).v, chg=bal-startV;
  const last=tr.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  const fine=SETTINGS.boeteEnabled&&A.kind==='live'?(tr.filter(t=>!t.hadPlan).length*(SETTINGS.boeteBedrag||0)):0;
  return head(`${greet()}, ${esc((SETTINGS.name||'Trader').split(' ')[0])}`,`<span style="font-style:italic">${esc(quote())}</span>`,addBtn())+
  (fine>0?`<div class="box" style="display:flex;align-items:center;gap:14px;margin-bottom:18px;border-color:rgba(224,163,58,.4)"><span class="chip amber">${ic('target',14)} ${L('Boete','Fine')}</span><div style="flex:1">${fmtM(fine,A.ccy)} ${L('open','open')}${SETTINGS.goedDoel?` ${L('voor','for')} <b>${esc(SETTINGS.goedDoel)}</b>`:''} · ${tr.filter(t=>!t.hadPlan).length} ${L('trade(s) zonder plan','trade(s) without a plan')}</div><button class="btn btn-g" data-go="discipline">${L('Bekijk','View')}</button></div>`:'')+
  `<div class="jgrid">
    <div class="box hero2 c12"><div class="hl"><div><div class="lab">${A.kind==='live'?ic('plug',15):ic('chart',15)} ${esc(A.name)} · ${L('Saldo','Balance')} <button class="ib" data-act="blur" style="width:28px;height:28px" title="${L('Verbergen','Hide')}">${ic(S.blur?'eyeoff':'eye',15)}</button></div>
      <div class="bal mono ${S.blur?'blur':''}">${fmtM(bal,A.ccy)}</div>
      <div class="chg"><span class="chip ${chg>=0?'pos':'neg'}">${fmtM(chg,A.ccy,{sign:1})} · ${S.range==='All'?L('totaal','total'):S.range}</span><span class="chip ${ret>=0?'pos':'neg'}">${fmtPct(ret)} ${L('rendement','return')}</span></div></div>
      <div class="ranges" id="rgs">${Object.keys(RANGES).map(k=>`<button data-rg="${k}" class="${S.range===k?'on':''}">${k}</button>`).join('')}</div></div>
      <div class="eqwrap" id="eqw">${eqSvg(inR.length>1?inR:pts.slice(-2),A)}</div></div>
    <div class="c12"><div class="kgrid">

      const row={ pair, dir:st.dir, pnl, rr:isNaN(rrv)?null:rrv, date:new Date(dOnly+'T'+tOnly).toISOString(), setup:q('#eS').value.trim()||(t&&t.mt5?'MT5 auto-sync':''), note:q('#eN').value.trim(), had_plan:st.plan, photo_url:urls.length>1?JSON.stringify(urls):(urls[0]||null) };

function pgCalendar(){ const A=acct(), c=S.cal, y=c.getFullYear(), mo=c.getMonth(), first=new Date(y,mo,1), nd=new Date(y,mo+1,0).getDate(), lead=(first.getDay()+6)%7;
  const days={}; A.trades.forEach(t=>{ const d=new Date(t.date); if(d.getFullYear()===y&&d.getMonth()===mo){ const k=d.getDate(); (days[k]=days[k]||{v:0,n:0,w:0}); days[k].v+=t.pnl; days[k].n++; if(t.pnl>0) days[k].w++ } });
  const mt=A.trades.filter(t=>{const d=new Date(t.date);return d.getFullYear()===y&&d.getMonth()===mo}), ms=stats(mt,A), tdy=new Date();
  const wd=LANG==='en'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Ma','Di','Wo','Do','Vr','Za','Zo'];

  const tot=lead+nd, rows=Math.ceil(tot/7); let dnum=1-lead;

    for(let c2=0;c2<7;c2++,dnum++){ if(dnum<1||dnum>nd){ cells+='<div class="cd out"></div>'; continue } const v=days[dnum]; if(v){wv+=v.v;wn+=v.n}
      const today=y===tdy.getFullYear()&&mo===tdy.getMonth()&&dnum===tdy.getDate();
      cells+=`<button class="cd ${v?(v.v>0?'p':v.v<0?'n':''):''} ${today?'today':''}" data-day="${dnum}"><span class="dn">${dnum}</span>${v?`<span><span class="dv mono" style="display:block">${isPhone()?shortN(v.v):fmtM(v.v,A.ccy,{dp:0,sign:1})}</span><span class="dc">${v.n} trade${v.n>1?'s':''}</span></span>`:''}</button>` }
    cells+=`<div class="cd wk"><span class="dn">W${r+1}</span>${wn?`<span><span class="dv mono ${wv>=0?'pos':'neg'}" style="display:block">${fmtM(wv,A.ccy,{dp:0,sign:1})}</span><span class="dc">${wn} trades</span></span>`:''}</div>` }
  return head(L('Kalender','Calendar'),L('Je resultaat per dag. Tik op een dag voor de trades.','Your result per day. Tap a day to see its trades.'),'')+
   `<div class="jgrid"><div class="box c12"><div class="calh2"><button class="ib" data-cal="-1">${ic('back')}</button><b>${first.toLocaleDateString(locale(),{month:'long',year:'numeric'})}</b><button class="ib" data-cal="1">${ic('next')}</button></div><div class="calg">${cells}</div></div>
   <div class="c12"><div class="kgrid">${kc(L('Maand P&L','Month P&L'),fmtM(ms.net,A.ccy,{sign:1}),ms.net>=0?'pos':'neg',`${ms.n} trades`,'chart')}${kc(L('Winratio','Win rate'),Math.round(ms.wr)+'%','',`${ms.wins}W · ${ms.losses}L`,'target')}${kc(L('Groene dagen','Green days'),Math.round(ms.greenDays)+'%','',`${Object.values(days).filter(v=>v.v>0).length} / ${Object.keys(days).length} ${L('dagen','days')}`,'calendar')}${kc(L('Beste dag','Best day'),Object.keys(days).length?fmtM(Math.max(...Object.values(days).map(v=>v.v)),A.ccy,{sign:1}):'—','pos','','arrowup')}${kc(L('Slechtste dag','Worst day'),Object.keys(days).length?fmtM(Math.min(...Object.values(days).map(v=>v.v)),A.ccy,{sign:1}):'—','neg','','arrowdown')}</div></div></div>` }
function openDay(day){ const A=acct(), c=S.cal; const tr=A.trades.filter(t=>{ const d=new Date(t.date); return d.getFullYear()===c.getFullYear()&&d.getMonth()===c.getMonth()&&d.getDate()===day }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const net=tr.reduce((s,t)=>s+t.pnl,0);

function radarSvg(ax){ const n=ax.length,cx=150,cy=128,R=88, pt=(i,f)=>{ const a=-Math.PI/2+2*Math.PI*i/n; return [cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)] };

  ax.forEach((a,i)=>{ const [x,y]=pt(i,1),[lx,ly]=pt(i,1.24); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line2)"/><text x="${lx}" y="${ly}" font-size="12.5" font-weight="700" fill="var(--ink2)" text-anchor="middle" dominant-baseline="middle">${a[0]}</text>` });
  return `<svg viewBox="0 0 300 256">${g}<polygon points="${ax.map((a,i)=>pt(i,Math.max(.04,a[1]/100)).join(',')).join(' ')}" fill="rgba(76,116,255,.25)" stroke="#4c74ff" stroke-width="2" stroke-linejoin="round"/></svg>` }

  const grp=(key)=>{ const mp={}; tr.forEach(t=>{ const k=key(t)||'—'; (mp[k]=mp[k]||[]).push(t) }); return Object.entries(mp).map(([k,g])=>({k,s:stats(g,A)})).sort((a,b)=>b.s.net-a.s.net) };
  const tbl=(rows,lab)=>`<table class="mtable"><thead><tr><th>${lab}</th><th>#</th><th>Win%</th><th>PF</th><th>${L('Netto','Net')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.k)}</b></td><td>${r.s.n}</td><td>${Math.round(r.s.wr)}%</td><td>${r.s.pf>=99?'∞':r.s.pf.toFixed(2)}</td><td class="mono ${r.s.net>=0?'pos':'neg'}"><b>${fmtM(r.s.net,A.ccy,{sign:1})}</b></td></tr>`).join('')}</tbody></table>`;
  const rB=[-3,-2,-1,0,1,2,3,4], rd=rB.map((b,i)=>{ const nb=rB[i+1]??99; const g=tr.filter(t=>t.rr!=null&&t.rr>=b&&t.rr<nb); return {l:(b>0?'+':'')+b+'R',v:g.length*(b>=0?1:-1),n:g.length} });
  const last30=Array.from({length:30},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-29+i); const k=dKey(d); const g=tr.filter(t=>dKey(t.date)===k); return {l:d.getDate()===1||i===0||i===29?String(d.getDate()):'',v:g.reduce((s,t)=>s+t.pnl,0),n:g.length} });

  `<div class="jgrid">
   <div class="c12"><div class="kgrid">${kc(L('Netto P&L','Net P&L'),fmtM(m.net,A.ccy,{sign:1}),m.net>=0?'pos':'neg',`${fmtM(m.exp,A.ccy,{sign:1})} / trade`,'chart')}${kc(L('Winratio','Win rate'),Math.round(m.wr)+'%','',`${m.wins}W · ${m.losses}L`,'target',m.wr)}${kc(L('Winstfactor','Profit factor'),m.pf>=99?'∞':m.pf.toFixed(2),m.pf>=1?'pos':'neg',`${fmtM(m.gp,A.ccy,{dp:0})} / ${fmtM(m.gl,A.ccy,{dp:0})}`,'bars')}${kc(L('Gem. winst / verlies','Avg win / loss'),m.al?(m.aw/m.al).toFixed(2):'—','',`${fmtM(m.aw,A.ccy,{dp:0})} / ${fmtM(m.al,A.ccy,{dp:0})}`,'coins')}${kc('Max drawdown',fmtM(-m.mdd,A.ccy,{dp:0}),'neg',m.ddPct.toFixed(1)+'%','arrowdown')}</div></div>
   <div class="box c8"><div class="boxh"><h3>${L('Resultaat laatste 30 dagen','Result last 30 days')}</h3></div>${vbars(last30,A.ccy)}</div>

   <div class="box c6"><div class="boxh"><h3>${L('Meer cijfers','More numbers')}</h3></div>${[[L('Beste trade','Best trade'),fmtM(m.best,A.ccy,{sign:1}),'pos'],[L('Slechtste trade','Worst trade'),fmtM(m.worst,A.ccy,{sign:1}),'neg'],[L('Langste winreeks','Longest win streak'),m.ws,''],[L('Langste verliesreeks','Longest loss streak'),m.ls,''],[L('Groene dagen','Green days'),Math.round(m.greenDays)+'%',''],[L('Plan gevolgd','Plan followed'),Math.round(m.planPct)+'%',''],[L('Herstelfactor','Recovery factor'),m.rec.toFixed(2),'']].map(([a,b,c])=>`<div class="lrow"><span class="lt">${a}</span><span class="lv mono ${c}">${b}</span></div>`).join('')}</div>

   <div class="box c6"><div class="boxh"><h3>Payouts</h3><button class="btn btn-g" data-act="payout" style="height:34px">${ic('plus',14)}</button></div>${D.payouts.length?D.payouts.map(p=>`<div class="lrow" data-po="${p.id}" style="cursor:pointer"><span class="li po">${ic('download',17)}</span><span class="lt"><b>Payout</b><small>${fmtDate(p.date)}${p.note?' · '+esc(p.note):''}</small></span><span class="lv mono neg">−${fmtM(p.amount,A.ccy)}</span></div>`).join(''):`<div class="muted" style="padding:10px 4px">${L('Nog geen payouts.','No payouts yet.')}</div>`}</div>

function openMoney(kind,item){ const isPo=kind==='payout', d=item?new Date(item.date):new Date(), p2=n=>String(n).padStart(2,'0');

/* ---------- Discipline ---------- */
function ring(pct,col){ const r=62,c=2*Math.PI*r; return `<div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(100,pct))/100)}"/></svg><div class="rv"><div><b>${Math.round(pct)}%</b><small>${L('plan gevolgd','plan followed')}</small></div></div></div>` }
function planStreak(tr){ const days={}; tr.forEach(t=>{ const k=dKey(t.date); days[k]=days[k]===false?false:(days[k]??true)&&t.hadPlan }); const ks=Object.keys(days).sort().reverse(); let n=0; for(const k of ks){ if(days[k]) n++; else break } return n }
function pgDiscipline(){ const A=acct(), tr=A.trades, m=stats(tr,A), noPlan=tr.filter(t=>!t.hadPlan).sort((a,b)=>new Date(b.date)-new Date(a.date)), live=A.kind==='live';
  const fine=live&&SETTINGS.boeteEnabled?noPlan.length*(SETTINGS.boeteBedrag||0):0, streak=planStreak(tr), col=m.planPct>=70?'var(--pos)':m.planPct>=40?'var(--amber)':'var(--neg)';
  return head('Discipline',L('Accountability: volg je je plan? Elke trade zonder plan kost je iets.','Accountability: do you follow your plan? Every trade without a plan costs you.'),'')+
  `<div class="jgrid">
   <div class="box c4" style="text-align:center">${ring(m.planPct,col)}<div class="muted" style="margin-top:10px">${m.plan} / ${m.n} trades ${L('met plan','with a plan')}</div></div>
   <div class="c8"><div class="kgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${kc(L('Reeks met plan','Plan streak'),streak+' '+L(streak===1?'dag':'dagen',streak===1?'day':'days'),streak?'pos':'',L('opeenvolgende handelsdagen','consecutive trading days'),'fire')}${kc(L('Trades zonder plan','Trades without a plan'),noPlan.length,noPlan.length?'neg':'pos','','target')}${kc(L('Openstaande boete','Open fine'),live&&SETTINGS.boeteEnabled?fmtM(fine,A.ccy):'—',fine?'neg':'',live&&SETTINGS.boeteEnabled?`${fmtM(SETTINGS.boeteBedrag,A.ccy)} / trade${SETTINGS.goedDoel?' → '+esc(SETTINGS.goedDoel):''}`:L('boetes staan uit','fines are off'),'coins')}${kc(L('Win% met plan','Win% with plan'),(()=>{const g=tr.filter(t=>t.hadPlan);return g.length?Math.round(g.filter(t=>t.pnl>0).length/g.length*100)+'%':'—'})(),'',L('zonder plan: ','without plan: ')+(noPlan.length?Math.round(noPlan.filter(t=>t.pnl>0).length/noPlan.length*100)+'%':'—'),'shield')}</div>
    <div class="box" style="margin-top:14px"><div class="quote">“${esc(quote())}”</div></div></div>
   ${live?`<div class="box c6"><div class="boxh"><h3>${L('Boete-regels','Fine rules')}</h3></div>
     <div class="field"><div class="tog"><span>${L('Boete bij trade zonder plan','Fine for a trade without a plan')}</span><span class="sw ${SETTINGS.boeteEnabled?'on':''}" id="bOn"></span></div></div>
     <div class="field"><label>${L('Bedrag per trade','Amount per trade')} (${esc(SETTINGS.currency)})</label><input class="inp" id="bAm" inputmode="decimal" value="${SETTINGS.boeteBedrag||25}"></div>
     <div class="field"><label>${L('Goed doel','Charity')}</label><input class="inp" id="bGd" value="${esc(SETTINGS.goedDoel)}" placeholder="${L('bijv. KWF','e.g. Red Cross')}"></div>
     <button class="btn btn-p" data-act="savefine">${L('Opslaan','Save')}</button></div>`:''}
   <div class="box ${live?'c6':'c12'}"><div class="boxh"><h3>${L('Trades zonder plan','Trades without a plan')}</h3></div>${noPlan.length?`<div class="tlist">${noPlan.slice(0,12).map(tRow).join('')}</div>`:`<div class="empty"><div class="ei">${ic('check',22)}</div><h4>${L('Top! Alles volgens plan.','Great! All according to plan.')}</h4></div>`}</div>
  </div>` }

/* ---------- MT5 ---------- */
function mt5Status(){ const mt=D.trades.filter(t=>t.mt5); if(!mt.length) return {k:'none',title:L('Nog niet gekoppeld','Not connected yet'),sub:L('Volg de stappen hieronder om MT5 te koppelen.','Follow the steps below to connect MT5.'),n:0};
  const last=mt.reduce((a,b)=>new Date(a.syncedAt)>new Date(b.syncedAt)?a:b), dt=new Date(last.syncedAt), h=(Date.now()-dt)/3600000;
  return {k:h<24?'live':'stale',title:h<24?L('Verbonden','Connected'):L('Niet recent gesynchroniseerd','Not synced recently'),sub:L('Laatste sync: ','Last sync: ')+relTime(dt),n:mt.length,last:dt} }
function pgMt5(){ const st=mt5Status(), key=SETTINGS.apiKey;
  const mock=(title,rows)=>`<div class="mock"><div class="mt"><i></i><i></i><i></i><span style="margin-left:6px">${title}</span></div><div class="mb">${rows}</div></div>`;
  return head(L('MT5-koppeling','MT5 connection'),L('Je live trades komen automatisch binnen via de TWF Journal EA. Backtest-trades gaan niet via MT5, die komen rechtstreeks uit TWF Backtest.','Your live trades come in automatically via the TWF Journal EA. Backtest trades do not use MT5, they come straight from TWF Backtest.'),'')+
  `<div class="jgrid">
   <div class="box c7"><div class="mt5st"><span class="dotb ${st.k}">${ic(st.k==='none'?'plug':st.k==='live'?'check':'clock',26)}</span><div style="flex:1;min-width:0"><h3>${st.k==='live'?'<span class="pulse"></span> ':''}${st.title}</h3><div class="muted" style="margin-top:4px">${st.sub}</div></div><button class="btn btn-g" data-act="mt5test">${ic('refresh',16)} ${L('Test verbinding','Test connection')}</button></div>
     <div class="mgrid" style="margin-bottom:0"><div><small>${L('Gesynchroniseerd','Synced')}</small><b>${st.n} trades</b></div><div><small>${L('MT5-account','MT5 account')}</small><b>${esc(SETTINGS.login||'—')}</b></div><div><small>Server</small><b>${esc(SETTINGS.server||SETTINGS.broker||'—')}</b></div></div></div>
   <div class="box c5"><div class="boxh"><h3>${ic('lock',16)} ${L('Jouw API-sleutel','Your API key')}</h3></div><p class="muted" style="margin:0 0 12px;font-size:13.5px;line-height:1.5">${L('Deze sleutel vul je in bij de EA in MT5. Deel hem met niemand.','You enter this key in the EA in MT5. Do not share it.')}</p>
     ${key?`<div class="keyf"><input class="inp" id="apiK" type="password" value="${esc(key)}" readonly><button class="ib" data-act="keyshow" title="${L('Tonen','Show')}">${ic('eye',18)}</button><button class="btn btn-p" data-act="keycopy">${ic('copy',16)} ${L('Kopieer','Copy')}</button></div>`:`<div class="muted">${L('Nog geen sleutel. Die wordt aangemaakt zodra de database hem voor je account genereert. Neem contact op als dit zo blijft.','No key yet. It is created as soon as the database generates one for your account. Get in touch if this persists.')}</div>`}</div>
   <div class="box c12"><div class="boxh"><h3>${L('Zo koppel je MT5','How to connect MT5')}</h3><span class="chip">${L('± 3 minuten','± 3 minutes')}</span></div><div class="steps">
     <div class="step"><span class="sn">1</span><div><b>${L('Zet de EA in MT5','Put the EA in MT5')}</b><p>${L('Open MT5 → <code>Bestand</code> → <code>Open datamap</code> → map <code>MQL5</code> → <code>Experts</code>. Zet daar het bestand <code>TWFJournal.ex5</code> neer en klik in MT5 met rechts op <b>Expert Advisors</b> → <b>Vernieuwen</b>.','Open MT5 → <code>File</code> → <code>Open Data Folder</code> → folder <code>MQL5</code> → <code>Experts</code>. Put the file <code>TWFJournal.ex5</code> there and in MT5 right-click <b>Expert Advisors</b> → <b>Refresh</b>.')}</p>${mock('Navigator',`<div class="mrow">📁 Expert Advisors</div><div class="mrow hl">⚙️ TWFJournal</div>`)}</div></div>
     <div class="step"><span class="sn">2</span><div><b>${L('Sta de verbinding toe','Allow the connection')}</b><p>${L('Ga naar <code>Extra</code> → <code>Opties</code> → tab <b>Expert Advisors</b>. Vink <b>WebRequest toestaan voor deze URL\'s</b> aan en voeg dit adres toe:','Go to <code>Tools</code> → <code>Options</code> → tab <b>Expert Advisors</b>. Tick <b>Allow WebRequest for listed URL</b> and add this address:')}</p>
       <div class="keyf" style="margin-top:8px;max-width:520px"><input class="inp" value="${esc(CFG.SUPABASE_URL)}" readonly><button class="btn btn-g" data-copy="${esc(CFG.SUPABASE_URL)}">${ic('copy',16)}</button></div>${mock(L('Opties','Options'),`<div class="mrow"><span><span class="ck">☑</span> ${L('Algoritmisch handelen toestaan','Allow algorithmic trading')}</span></div><div class="mrow hl"><span><span class="ck">☑</span> ${L('WebRequest toestaan voor URL\'s','Allow WebRequest for listed URL')}</span></div><div class="mrow" style="font-family:ui-monospace,monospace">${esc(CFG.SUPABASE_URL.replace('https://',''))}</div>`)}</div></div>
     <div class="step"><span class="sn">3</span><div><b>${L('Sleep de EA op een chart en plak je sleutel','Drag the EA onto a chart and paste your key')}</b><p>${L('Sleep <b>TWFJournal</b> op een willekeurige chart (één keer is genoeg). Ga naar het tabblad <b>Invoer</b> en plak je API-sleutel bij <code>ApiKey</code>.','Drag <b>TWFJournal</b> onto any chart (once is enough). Open the <b>Inputs</b> tab and paste your API key into <code>ApiKey</code>.')}</p>${mock('TWFJournal',`<div class="mrow"><span>${L('Variabele','Variable')}</span><span>${L('Waarde','Value')}</span></div><div class="mrow hl"><span>ApiKey</span><span>${key?esc(key.slice(0,6))+'••••••':'••••••••'}</span></div>`)}</div></div>
     <div class="step"><span class="sn">4</span><div><b>${L('Zet Algo Trading aan','Turn on Algo Trading')}</b><p>${L('Klik bovenin MT5 op <b>Algo Trading</b> zodat hij groen is. Rechtsboven op de chart zie je dan een blauw hoedje bij TWFJournal.','Click <b>Algo Trading</b> at the top of MT5 so it turns green. A blue hat appears next to TWFJournal at the top right of the chart.')}</p></div></div>
     <div class="step"><span class="sn">5</span><div><b>${L('Klaar! Test de verbinding','Done! Test the connection')}</b><p>${L('Sluit een trade en klik hierboven op <b>Test verbinding</b>. Binnen een minuut staat hij in je journal. Laat MT5 openstaan om te blijven synchroniseren (een VPS kan ook).','Close a trade and click <b>Test connection</b> above. Within a minute it appears in your journal. Keep MT5 open to keep syncing (a VPS works too).')}</p></div></div>
   </div></div>
   <div class="box c12"><div class="boxh"><h3>${L('Werkt het niet?','Not working?')}</h3></div>
     <details class="faq"><summary>${L('Er komen geen trades binnen','No trades are coming in')}</summary><p>${L('Controleer of Algo Trading groen is, het adres bij WebRequest exact klopt (met https://) en de API-sleutel zonder spaties is geplakt. Kijk in MT5 onder Toolbox → Experts voor foutmeldingen.','Check that Algo Trading is green, the WebRequest address is exact (with https://) and the API key was pasted without spaces. Look under Toolbox → Experts in MT5 for errors.')}</p></details>
     <details class="faq"><summary>${L('Moet MT5 altijd open staan?','Does MT5 have to stay open?')}</summary><p>${L('Ja, de EA synchroniseert alleen als MT5 draait. Trades die je sluit terwijl MT5 uit staat, komen binnen zodra je MT5 weer opent.','Yes, the EA only syncs while MT5 runs. Trades closed while MT5 was off come in as soon as you open MT5 again.')}</p></details>
     <details class="faq"><summary>${L('Kan ik ook handmatig trades toevoegen?','Can I add trades manually as well?')}</summary><p>${L('Ja. Op je Live-rekening kun je naast MT5 altijd zelf trades toevoegen met de knop Trade toevoegen. MT5-trades kun je aanvullen met een notitie, setup en screenshots.','Yes. On your Live account you can always add trades yourself next to MT5 with the Add trade button. You can enrich MT5 trades with a note, setup and screenshots.')}</p></details>
     <details class="faq"><summary>${L('Hoe zit het met mijn backtests?','What about my backtests?')}</summary><p>${L('Backtests gaan niet via MT5. Elke sessie in TWF Backtest verschijnt automatisch als eigen rekening; kies hem bovenin bij de rekening-kiezer.','Backtests do not go through MT5. Every session in TWF Backtest shows up automatically as its own account; pick it at the top in the account picker.')}</p></details>
   </div>
  </div>` }

/* ---------- binding ---------- */
function bindPage(m){
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{ e.preventDefault(); if(b.dataset.stab) S.setTab=b.dataset.stab; go(b.dataset.go) });
  m.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>openTrade(b.dataset.tr));
  m.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{ S.range=b.dataset.rg; lsSet('twfj_range',S.range); render() });
  m.querySelectorAll('[data-tf]').forEach(el=>{ const k=el.dataset.tf; el[el.tagName==='INPUT'?'oninput':'onchange']=()=>{ S.tf[k]=el.value; const pos=el.selectionStart; render(); if(el.tagName==='INPUT'){ const n=$('#main [data-tf="q"]'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} } } } });
  m.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{ S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+(+b.dataset.cal),1); render() });
  m.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openDay(+b.dataset.day));
  m.querySelectorAll('[data-stab]').forEach(b=>{ if(!b.dataset.go) b.onclick=()=>{ S.setTab=b.dataset.stab; render() } });
  m.querySelectorAll('[data-po]').forEach(b=>b.onclick=()=>openMoney('payout',D.payouts.find(x=>String(x.id)===b.dataset.po)));
  m.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>openMoney('adj',D.adjs.find(x=>String(x.id)===b.dataset.adj)));
  m.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
  m.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{ setTheme(b.dataset.th); render() });
  m.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>setLang(b.dataset.lg));
  m.querySelectorAll('[data-lgt]').forEach(b=>b.onclick=()=>{ lsSet('twfj_logo',b.dataset.lgt); applyLogoTheme(); render() });
  m.querySelectorAll('[data-ict]').forEach(b=>b.onclick=()=>{ lsSet('twfj_icon',b.dataset.ict); applyAppIcon(b.dataset.ict); render() });
  const sw=(id,fn)=>{ const e=m.querySelector('#'+id); if(e) e.onclick=()=>{ e.classList.toggle('on'); fn(e.classList.contains('on')) } };
  sw('sBl',on=>{ S.blur=on; lsSet('twfj_blur',on?'1':'0') });
  sw('sLk',async on=>{ const r=await sb.from('settings').update({lock_enabled:on}).eq('user_id',ME.id); if(r.error){ toast(L('Opslaan mislukt','Save failed'),r.error.message,'bad'); return } SETTINGS.lockEnabled=on; toast(L('Opgeslagen','Saved'),on?L('Pincode staat aan','PIN is on'):L('Pincode staat uit','PIN is off'),'ok',1800) });
  sw('bOn',()=>{});
  const A=a=>m.querySelectorAll(`[data-act="${a}"]`);
  const on=(a,fn)=>A(a).forEach(b=>b.onclick=fn);
  on('add',()=>openEditor()); on('openbt',()=>window.open(BACKTEST_URL,'_blank','noopener'));
  on('blur',()=>{ S.blur=!S.blur; lsSet('twfj_blur',S.blur?'1':'0'); render() });
  on('payout',()=>openMoney('payout')); on('adj',()=>openMoney('adj'));
  on('mt5test',async e=>{ const b=e.currentTarget; b.disabled=true; await fetchTrades(); await fetchSettings(); b.disabled=false; const st=mt5Status(); render(); toast(st.k==='none'?L('Nog geen MT5-trades','No MT5 trades yet'):st.title,st.k==='none'?L('Sluit een trade in MT5 en probeer het opnieuw.','Close a trade in MT5 and try again.'):st.sub,st.k==='live'?'ok':st.k==='none'?'info':'bad') });
  on('keyshow',()=>{ const k=m.querySelector('#apiK'); k.type=k.type==='password'?'text':'password' });
  on('keycopy',()=>copyText(SETTINGS.apiKey));
  on('savefine',async()=>{ const en=m.querySelector('#bOn').classList.contains('on'), am=parseFloat(String(m.querySelector('#bAm').value).replace(',','.'))||0, gd=m.querySelector('#bGd').value.trim();

const LOCK={entry:'',busy:false,hiddenAt:0,onDone:null};

  el.innerHTML=`<span class="lgtile lgcur">${TWF_MARK}</span><h2>${greet()}, ${esc((SETTINGS.name||'Trader').split(' ')[0])}</h2><div class="lsub">${L('Voer je pincode in','Enter your PIN')}</div>

   <div class="pad" id="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'][n-1]||'&nbsp;'}</small></button>`).join('')}

  $('#lforgot').onclick=lockForgot; lockDots() }
function lockDots(state){ const d=$('#pdots'); if(!d) return; d.querySelectorAll('i').forEach((x,i)=>x.classList.toggle('f',i<LOCK.entry.length)); d.classList.toggle('err',state==='err'); d.classList.toggle('ok',state==='ok') }
function lockKey(k){ if(LOCK.busy) return; const pe=$('#perr'); if(pe) pe.classList.remove('on'); $('#pdots').classList.remove('err');
  if(k==='del'){ LOCK.entry=LOCK.entry.slice(0,-1); lockDots(); return }
  if(k==='fid'){ if(pkGet()) pkVerify().then(ok=>{ if(ok) lockOk() }); return }
  if(LOCK.entry.length>=4) return; LOCK.entry+=k; lockDots();
  if(LOCK.entry.length===4){ if(LOCK.entry===String(SETTINGS.lockPin||'0000')) lockOk(); else lockErr() } }
function lockOk(){ LOCK.busy=true; lockDots('ok'); setTimeout(()=>{ $('#lock').classList.add('hide'); document.body.classList.remove('locked'); LOCK.busy=false; const f=LOCK.onDone; LOCK.onDone=null; if(f) f() },220) }
function lockErr(){ LOCK.busy=true; const d=$('#pdots'); lockDots('err'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); $('#perr').classList.add('on'); try{ navigator.vibrate&&navigator.vibrate([60,40,60]) }catch(e){}
  setTimeout(()=>{ LOCK.entry=''; LOCK.busy=false; d.classList.remove('shake'); lockDots('err') },650) }
document.addEventListener('keydown',e=>{ if($('#lock').classList.contains('hide')) return; if(/^\d$/.test(e.key)){ e.preventDefault(); lockKey(e.key) } else if(e.key==='Backspace'){ e.preventDefault(); lockKey('del') } });
