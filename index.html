const PK_KEY='twf_passkey_login';
function pkGet(){ try{ return JSON.parse(lsGet(PK_KEY)||'null') }catch(e){ return null } }
function pkSave(o){ lsSet(PK_KEY,JSON.stringify(o)) }
async function pkVerify(){ try{ const ch=new Uint8Array(32); crypto.getRandomValues(ch); const a=await navigator.credentials.get({publicKey:{challenge:ch,userVerification:'required',timeout:60000}}); return !!a }catch(e){ return false } }
async function pkSetup(){ if(!window.PublicKeyCredential){ toast(L('Niet ondersteund','Not supported'),L('Deze browser ondersteunt geen Face ID / Touch ID.','This browser does not support Face ID / Touch ID.'),'bad'); return }
  try{ const {data:sess}=await sb.auth.getSession(); if(!sess||!sess.session){ toast(L('Log opnieuw in','Sign in again'),L('Log eerst opnieuw in en probeer het dan nog eens.','Sign in again first, then try once more.'),'bad'); return }
    const ch=new Uint8Array(32); crypto.getRandomValues(ch);
    const cred=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'TWF Journal'},user:{id:new TextEncoder().encode('twfj:'+ME.id),name:(SETTINGS.name||'Trader')+' · Journal',displayName:(SETTINGS.name||'Trader')+' · TWF Journal'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
    if(!cred) throw new Error('cancel');
    pkSave({credId:btoa(String.fromCharCode(...new Uint8Array(cred.rawId))),refreshToken:sess.session.refresh_token,userId:ME.id,name:SETTINGS.name||'Trader'});
    render(); toast(L('Face ID staat aan','Face ID is on'),L('Je kunt nu inloggen en ontgrendelen met Face ID / Touch ID.','You can now sign in and unlock with Face ID / Touch ID.'),'ok') }
  catch(e){ if(e&&e.name!=='NotAllowedError') toast(L('Instellen mislukt','Setup failed'),e.message||String(e),'bad') } }
async function pkLogin(){ const s=pkGet(); const er=$('#lgErr'); er.textContent=''; if(!s){ er.textContent=L('Nog geen Face ID op dit apparaat. Log één keer in met je wachtwoord en zet het aan bij Instellingen → Beveiliging.','No Face ID on this device yet. Sign in once with your password and turn it on in Settings → Security.'); return }
  if(!(await pkVerify())) return;
  const b=$('#lgPk'); b.disabled=true;
  try{ const {data,error}=await sb.auth.refreshSession({refresh_token:s.refreshToken}); if(error||!data||!data.session){ const msg=((error&&error.message)||'').toLowerCase(); const fatal=!error||[400,401,403].includes(error.status)||msg.includes('refresh')||msg.includes('invalid');
      if(fatal){ lsDel(PK_KEY); pkUI(); er.textContent=L('Face ID is verlopen. Log één keer in met je wachtwoord en zet het opnieuw aan.','Face ID expired. Sign in once with your password and turn it on again.') } else er.textContent=L('Geen verbinding. Probeer het zo nog eens.','No connection. Try again in a moment.'); return }
    ME=data.session.user; pkSave({...s,userId:ME.id,refreshToken:data.session.refresh_token}); await enterApp(true) }
  catch(e){ er.textContent=L('Geen verbinding. Probeer het zo nog eens.','No connection. Try again in a moment.') } finally{ b.disabled=false } }
function pkUI(){ const s=pkGet(), on=!!(s&&window.PublicKeyCredential); $('#lgPk').classList.toggle('hide',!on); $('#lgPkOr').classList.toggle('hide',!on); if(on) $('#lgPkT').innerHTML=`${L('Inloggen met Face ID','Sign in with Face ID')} <small>· ${esc(s.name||'')}</small>` }
function attachAuth(){ sb.auth.onAuthStateChange((ev,session)=>{ const s=pkGet(); if(session&&s&&s.userId&&session.user&&session.user.id===s.userId&&s.refreshToken!==session.refresh_token) pkSave({...s,refreshToken:session.refresh_token}) }) }
function pkOffer(){ if(!window.PublicKeyCredential||pkGet()||sessionStorage.getItem('twfj_pkasked')) return; try{sessionStorage.setItem('twfj_pkasked','1')}catch(e){}

/* ---------------- updates ---------------- */
const UPD={latest:null,toasted:false,timer:null};
const verNum=v=>String(v||'').replace(/^v/i,'').split('.').map(x=>parseInt(x,10)||0);
function verCmp(a,b){ const A=verNum(a),B=verNum(b); for(let i=0;i<Math.max(A.length,B.length);i++){ const d=(A[i]||0)-(B[i]||0); if(d) return d } return 0 }
const updAvailable=()=>!!UPD.latest&&verCmp(UPD.latest,CFG.VERSION)>0;
async function fetchServerVersion(){ try{ const r=await fetch(location.pathname+'?nocache='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; const tx=await r.text(); return (tx.match(/TWF_JOURNAL_VERSION = '(v[0-9.]+)'/)||[])[1]||null }catch(e){ return null } }
function markUpdate(){ document.querySelectorAll('[data-go="settings"]').forEach(b=>b.classList.toggle('upd',updAvailable())) }
async function checkUpdate(silent){ if(location.protocol==='file:') return; const v=await fetchServerVersion(); if(!v) return; UPD.latest=v; markUpdate(); const ub=$('#updBox'); if(ub){ ub.innerHTML=updBoxHtml(); bindUpdBox(ub) }
  if(updAvailable()&&!UPD.toasted&&!silent){ UPD.toasted=true; toast(L('Update beschikbaar','Update available'),L(`Versie ${v} van TWF Journal staat klaar.`,`Version ${v} of TWF Journal is ready.`),'info',20000,{label:L('Nu bijwerken','Update now'),fn:reloadForUpdate}) } }
function reloadForUpdate(){ lsSet('twfj_lastver',CFG.VERSION); location.replace(location.pathname+'?v='+encodeURIComponent(UPD.latest||Date.now())) }
function updBoxHtml(){ const up=updAvailable(); return `<div class="srow"><div class="stx"><b>${up?L('Update beschikbaar: ','Update available: ')+UPD.latest:L('Je hebt de nieuwste versie','You are up to date')}</b><small>${L('Versie','Version')} ${CFG.VERSION} · ${CFG.BUILD}</small></div>${up?`<button class="btn btn-p" data-u="go">${ic('download',16)} ${L('Nu bijwerken','Update now')}</button>`:`<button class="btn btn-g" data-u="chk">${ic('refresh',16)} ${L('Controleren','Check')}</button>`}</div>` }
function bindUpdBox(root){ const g=root.querySelector('[data-u="go"]'); if(g) g.onclick=reloadForUpdate; const c=root.querySelector('[data-u="chk"]'); if(c) c.onclick=async()=>{ c.disabled=true; await checkUpdate(true); c.disabled=false; if(!updAvailable()) toast(L('Up-to-date','Up to date'),CFG.VERSION,'ok',1800) } }
function updatedToast(){ const last=lsGet('twfj_lastver'); if(last&&verCmp(CFG.VERSION,last)>0) setTimeout(()=>toast(L(`Bijgewerkt naar ${CFG.VERSION}`,`Updated to ${CFG.VERSION}`),L('Je gebruikt nu de nieuwste versie van TWF Journal.','You are now on the latest version of TWF Journal.'),'ok',6000),1200); lsSet('twfj_lastver',CFG.VERSION) }
function startUpdateWatch(){ if(UPD.timer) return; setTimeout(()=>checkUpdate(false),4000); UPD.timer=setInterval(()=>checkUpdate(false),10*60000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(false) }) }

function drawLoginCandles(){ let g='',x=10,p=180; for(let i=0;i<26;i++){const o=p,c=p+(Math.sin(i*1.3)*22+(i%5===0?-30:6)-4),h=Math.min(o,c)-8-Math.abs(Math.cos(i)*14),l=Math.max(o,c)+8+Math.abs(Math.sin(i*2)*12);const up=c<o;
  g+=`<line x1="${x+6}" y1="${h}" x2="${x+6}" y2="${l}" stroke="${up?'#2fbf71':'#e5534b'}" stroke-width="2"/><rect x="${x}" y="${Math.min(o,c)}" width="12" height="${Math.max(3,Math.abs(c-o))}" rx="2" fill="${up?'#2fbf71':'#e5534b'}"/>`;p=c;x+=20} $('#loginCandles').innerHTML=g }
function init(){
  document.querySelectorAll('[data-lgtile]').forEach(el=>el.innerHTML=TWF_MARK); applyLogoTheme(); applyAppIcon();
  setTheme(lsGet('twf_theme')==='light'?'light':'dark'); document.documentElement.lang=LANG; drawLoginCandles(); applyLoginText();
  $('#toReg').onclick=()=>showReg(true); $('#toLog').onclick=()=>showReg(false);
  $('#lgBtn').onclick=doLogin; $('#rgBtn').onclick=doRegister; $('#lgPk').onclick=pkLogin;
  ['#lgName','#lgPass'].forEach(s=>$(s).onkeydown=e=>{ if(e.key==='Enter') doLogin() }); ['#rgUser','#rgLogin','#rgPass'].forEach(s=>$(s).onkeydown=e=>{ if(e.key==='Enter') doRegister() });
  $('#lgLang').onchange=e=>setLang(e.target.value); $('#lgTheme').onclick=()=>setTheme(curTheme()==='dark'?'light':'dark');
  const last=lsGet('twfj_lastlogin'); if(last) $('#lgName').value=last;
  if(/[?&]v=/.test(location.search)) try{ history.replaceState(null,'',location.pathname) }catch(e){}
  try{ sb=newSb(); attachAuth() }catch(e){ $('#lgErr').textContent=L('Kon geen verbinding maken. Controleer je internet.','Could not connect. Check your internet.') }
  pkUI();
  setTimeout(()=>{ if(!last) $('#lgName').focus(); else $('#lgPass').focus() },60);
  setTimeout(()=>checkUpdate(true),3000);
}
init();

</script>
